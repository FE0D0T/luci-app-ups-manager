name: Build APK via OpenWrt SDK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SDK_URL: "https://downloads.openwrt.org/releases/25.12.0/targets/x86/64/openwrt-sdk-25.12.0-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
    steps:
      - name: Checkout package source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gawk gettext libncurses-dev zstd python3 wget rsync

      - name: Download OpenWrt SDK
        run: |
          wget -q "$SDK_URL" -O sdk.tar.zst
          tar --zstd -xf sdk.tar.zst
          mv openwrt-sdk-* sdk

      - name: Place package into SDK
        run: |
          mkdir -p sdk/package/luci-app-ups-manager
          rsync -a --exclude='.git' --exclude='.github' --exclude='sdk' "$GITHUB_WORKSPACE"/ "$GITHUB_WORKSPACE"/sdk/package/luci-app-ups-manager/

      - name: Update feeds and select package
        working-directory: sdk
        run: |
          ./scripts/feeds update luci packages
          ./scripts/feeds install luci-base nut nut-common nut-server nut-upsmon nut-upsc nut-upscmd nut-driver-usbhid-ups nut-driver-blazer_usb curl rpcd rpcd-mod-file
          printf '%s\n' \
            "CONFIG_PACKAGE_luci-app-ups-manager=m" \
            "# lucihttp собирается из GitHub и падает в SDK; на роутере ставится готовый пакет из репозитория 25.12" \
            "CONFIG_PACKAGE_liblucihttp=n" \
            "CONFIG_PACKAGE_liblucihttp-ucode=n" \
            "CONFIG_PACKAGE_liblucihttp-lua=n" > .config
          make defconfig
          grep -E 'lucihttp' .config || echo "lucihttp: не в .config"

      - name: Compile package
        id: compile
        working-directory: sdk
        run: |
          set -o pipefail
          make package/luci-app-ups-manager/compile V=s -j1 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Show build errors in summary
        if: failure()
        run: |
          {
            echo "## Ошибки сборки"
            echo '```'
            grep -nE 'Error|ERROR|error:|\*\*\*|No rule|not found|cannot|undefined' "$GITHUB_WORKSPACE/build.log" | tail -n 60 || echo "строк с ошибками не найдено"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Collect APK artifacts
        run: |
          mkdir -p out
          find sdk/bin -name 'luci-app-ups-manager-*.apk' -exec cp {} out/ \;
          ls -la out
          test -n "$(ls out/*.apk 2>/dev/null)" || { echo "APK не найден"; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-ups-manager-apk
          path: out/*.apk
